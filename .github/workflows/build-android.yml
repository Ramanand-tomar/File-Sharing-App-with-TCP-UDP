name: Build Android Standalone APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479edd1fe58d746fe60249d186d6d588" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Standalone Release & Debug APKs
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Standalone APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirShare-APKs
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-release
          name: "AirShare v1.0.0 Standalone APKs"
          body: |
            ### 🚀 AirShare P2P File Sharing (Production v1.0.0)

            Direct download links for offline mobile installation:
            - **`app-release.apk` (Recommended)**: Standalone production APK with pre-compiled Hermes bytecode, fully optimized.
            - **`app-debug.apk`**: Standalone debug build with developer inspection support.

            #### 📲 Features:
            - ⚡ **Offline & Standalone**: Pre-bundled JavaScript (No PC, Metro, or USB required).
            - 📡 **UDP Peer Discovery**: Automatically finds nearby devices on the same Wi-Fi / Hotspot.
            - 📦 **Framed TCP Binary Streaming**: Bounded sliding-window chunk streaming without memory bloat.
            - 🔒 **End-to-End SHA-256 Integrity**: Automatic file verification upon completion.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
